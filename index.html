<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">

    <title>جارٍ فتح الشهادة…</title>

    <style>
        body {
            font-family: system-ui, Tahoma, sans-serif;
            background: #f7f8fa;
            color: #263238;
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
        }

        .box {
            text-align: center;
            padding: 2rem;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #dce3e8;
            border-top-color: #177b70;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main class="box">
        <div class="spinner" id="spinner"></div>
        <p id="msg" role="status">جارٍ فتح الشهادة…</p>
    </main>

    <script>
        (function () {
            'use strict';

            // الدومين النهائي لصفحة التحقق
            const FRONTEND_BASE = 'https://balady-site-theta.vercel.app';

            const msg = document.getElementById('msg');
            const spinner = document.getElementById('spinner');

            function fail(message) {
                msg.textContent = message;
                spinner.style.display = 'none';
            }

            try {
                const current = new URL(window.location.href);
                const params = new URLSearchParams(current.search);

                // استخراج رقم الشهادة
                let id = params.get('id');

                // دعم الروابط التي تحتوي على ID في المسار
                if (!id) {
                    const segments = current.pathname
                        .split('/')
                        .filter(Boolean)
                        .map(segment => decodeURIComponent(segment));

                    const last = segments[segments.length - 1] || '';

                    if (
                        last &&
                        !/^(balady-qr-gateway|view|index\.html|404\.html)$/i.test(last)
                    ) {
                        id = last;
                    }
                }

                // التحقق من صحة المعرف
                if (
                    !id ||
                    !id.trim() ||
                    id.length > 256 ||
                    /[\x00-\x1f\x7f]/.test(id)
                ) {
                    fail('رابط غير صالح: لا يوجد معرّف شهادة صحيح.');
                    return;
                }

                // حذف ID من المعاملات الأصلية لتجنب التكرار
                params.delete('id');

                // إنشاء رابط التحقق النهائي
                const target = new URL(
                    FRONTEND_BASE.replace(/\/+$/, '') +
                    '/health/health-verify'
                );

                // تمرير ID بنفس الترميز الموجود في QR
                target.searchParams.set('id', id.trim());

                // الاحتفاظ بباقي Query Parameters
                params.forEach(function (value, key) {
                    target.searchParams.append(key, value);
                });

                // التحويل التلقائي
                window.location.replace(target.href);

            } catch (error) {
                fail('تعذّر فتح رابط الشهادة. يرجى التحقق من الرابط.');
            }

        })();
    </script>

</body>
</html>
